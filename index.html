<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <script type="module" src="/src/main.ts"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
</head>

<body>
    <button id="theme-toggle" title="Toggle dark mode" tabindex="-1"></button>
    <button id="mode-p1" class="mode-toggle" title="Player mode" tabindex="-1">P1</button>
    <button id="mode-c1" class="mode-toggle" title="AI mode" tabindex="-1">C1</button>
    <button id="mode-c2" class="mode-toggle" title="CEM AI mode" tabindex="-1">C2</button>
    <button id="speed-up" class="mode-toggle" title="Increase speed" tabindex="-1">+</button>
    <button id="speed-down" class="mode-toggle" title="Decrease speed" tabindex="-1">-</button>
    <div id="game-1" class="container">Loading...</div>
    <div id="game-2" class="container"></div>

    <a class="github-link" href="https://github.com/jerold" title="Check me out on Github"><img src="github-icon.png" width=30 height=30></a>
</body>

</html>
